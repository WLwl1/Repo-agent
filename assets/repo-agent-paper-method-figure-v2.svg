<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1040" viewBox="0 0 1900 1040" role="img" aria-labelledby="title desc">
<title id="title">Repo Agent Method Figure</title>
<desc id="desc">Aligned paper-style method figure for Repo Agent.</desc>
