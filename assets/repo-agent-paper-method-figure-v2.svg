<rect class="paper" width="1900" height="1040"/>
<rect class="topbar" x="64" y="42" width="1772" height="64" rx="8"/>
<text x="950" y="82" class="text-title" text-anchor="middle">Question: Where is the chat endpoint implemented, and what evidence supports the location?</text>
<rect class="left-bg" x="62" y="114" width="515" height="806" rx="0"/>
